<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>dsh-ee · 企业 DSH 插件市场</title>
    <script>
      // 首屏先落主题再渲染，避免刷新时闪一下浅色。逻辑与 src/lib/theme.ts 保持一致。
      (function () {
        try {
          // 宿主 iframe 用 ?embed=1&theme=light|dark 指定主题：只作用于本次页面，不写回 localStorage。
          var params = new URLSearchParams(window.location.search);
          var embed = params.get("embed") === "1";
          var forced = embed ? params.get("theme") : null;
          var mode =
            forced === "light" || forced === "dark"
              ? forced
              : localStorage.getItem("dsh-ee:theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage 被禁用时按浅色起步 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
